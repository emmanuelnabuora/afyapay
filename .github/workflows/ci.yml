name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Known vulnerabilities in any npm package we ship or build with.
      - run: npm audit --audit-level=high
      # A second, independent database (Trivy), plus secrets and config mistakes in the repository.
      # AfyaPay builds no container image today (Render builds Node directly); if one is added, scan it here too.
      - name: Trivy filesystem scan
        # Pinned to a commit, not a tag, so a moved tag cannot change what runs here.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build-and-test:
    name: Type check, build and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afyapay
          POSTGRES_PASSWORD: afyapay
          POSTGRES_DB: afyapay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U afyapay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database, not a secret.
      TEST_DATABASE_URL: postgres://afyapay:afyapay@localhost:5432/afyapay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
